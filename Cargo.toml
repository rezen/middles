[package]
name = "middles"
version = "0.2.0"
edition = "2024"
description = "A small policy-enforcing proxy for npm, PyPI, Composer, RubyGems, Homebrew bottles, and APT"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
cvss = "2.2.0"
clap = { version = "4", features = ["derive"] }
flate2 = "1.1.10"
futures-util = "0.3"
indexmap = { version = "2", features = ["serde"] }
moka = { version = "0.12", features = ["future"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
ring = "0.17"
rusqlite = { version = "0.38", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
xz2 = "0.1.7"
zip = { version = "5.1.0", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

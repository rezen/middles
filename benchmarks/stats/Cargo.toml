[package]
name = "middles-stats-bench"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fjall = "=3.1.10"
redb = "=4.3.0"
rusqlite = { version = "=0.38.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1

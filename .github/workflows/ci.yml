name: Rust
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: python3 -m unittest discover -s scripts -p 'test_homebrew_spike.py'
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build --tag middles:ci .
      - run: python3 scripts/docker-smoke.py middles:ci
  homebrew:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
      - run: brew style Formula/middles.rb
      - run: brew tap rezen/middles "$GITHUB_WORKSPACE"
      - run: brew audit --strict --formula rezen/middles/middles
      - run: brew install --build-from-source rezen/middles/middles
      - run: brew test rezen/middles/middles

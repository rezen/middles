listen = "127.0.0.1:8080"
# The client-visible base URL. Set this to your HTTPS URL behind a reverse proxy.
public_url = "http://127.0.0.1:8080"

[policy]
min_age_days = 7
# Package-wide monthly downloads; 0 disables statistics requests entirely.
min_monthly_downloads = 0
# Inspect cached registry metadata; "deny" also rejects known dependency hooks,
# Composer plugins/installers, and Python source builds. See README limitations.
install_hooks = "report"

# Each ecosystem inherits unspecified values from [policy].
[npm]
# min_monthly_downloads = 1000
# install_hooks = "deny"
[pip]
# min_age_days = 14
[composer]
# Composer also requires this many days since first observed by this proxy.
# Preserve the SQLite file across deployments.

[rubygems]
# Age inherits [policy]. Monthly evidence and hook inspection are unavailable.
# Explicit overrides are needed if the global policy enables these restrictions.
min_monthly_downloads = 0
install_hooks = "report"

[homebrew]
# Official stable core bottles only. Set false to disable the adapter.
enabled = true
# No age wait; bottle signatures, digests and graph relationships are still checked.
min_age_days = 0
# To require age, set min_age_days > 0. The default basis is "local_first_seen";
# this opt-in alternative uses the reported OCI build date as a heuristic:
# age_basis = "oci_created"
min_monthly_downloads = 0
install_hooks = "report"
# Only enable platforms you intend to serve. Real-client smoke: 7.0.6 on arm64 Tahoe.
platforms = ["arm64_tahoe"]
# The signed formula catalogue exceeds the general 32 MiB metadata default.
max_api_mb = 64

[apt]
enabled = false
max_index_mb = 96
# APT has no monthly download evidence and cannot inspect maintainer scripts.
min_monthly_downloads = 0
install_hooks = "report"
# To enable, add deb.debian.org to upstream.artifact_hosts and configure a repo:
# [[apt.repos]]
# name = "debian"
# url = "https://deb.debian.org/debian"
# suites = ["bookworm", "bookworm-updates"]
# components = ["main"]
# architectures = ["amd64"]

[cache]
path = "data/cache.sqlite3"
memory_mb = 64
# Budget for cached response payloads and entry overhead, not a physical DB size cap.
disk_mb = 512
metadata_ttl_secs = 300
stats_ttl_secs = 86400

[upstream]
# rubygems = "https://rubygems.org"
timeout_secs = 60
# Permits per upstream pool; metadata fetches and archive streams have separate pools.
concurrency = 32
max_metadata_mb = 32
# Add exact archive hosts only when needed. Every redirect is checked too.
artifact_hosts = ["registry.npmjs.org", "files.pythonhosted.org", "rubygems.org", "api.github.com", "github.com", "codeload.github.com", "gitlab.com", "bitbucket.org"]
